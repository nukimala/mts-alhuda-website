$kind: http-request
name: '16. Daftar tugas'
method: GET
url: '{{baseUrl}}/assignments?per_page=10'
order: 2000
queryParams:
  - key: per_page
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('data.assignments array', () => pm.expect(body.data && body.data.assignments).to.be.an('array'));
      if (body.data && body.data.assignments.length > 0) {
        const a = body.data.assignments[0];
        pm.collectionVariables.set('assignmentPublicId', a.public_id || '');
        pm.test('item tugas punya public_id', () => pm.expect(a.public_id).to.be.a('string').and.not.empty);
        pm.test('item tugas punya kelas', () => pm.expect(a.class).to.be.an('object'));
      }