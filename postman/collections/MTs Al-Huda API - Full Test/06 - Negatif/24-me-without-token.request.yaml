$kind: http-request
name: '24. /me tanpa token (401)'
method: GET
url: '{{baseUrl}}/me'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('kode UNAUTHORIZED', () => pm.expect(body.error && body.error.code).to.eql('UNAUTHORIZED'));