$kind: http-request
name: '26. Login akun tidak ada (401)'
method: POST
url: '{{baseUrl}}/auth/login'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "identifier": "tidak-ada-{{$timestamp}}",
      "password": "salah",
      "platform": "unknown"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('kode INVALID_CREDENTIALS', () => pm.expect(body.error && body.error.code).to.eql('INVALID_CREDENTIALS'));