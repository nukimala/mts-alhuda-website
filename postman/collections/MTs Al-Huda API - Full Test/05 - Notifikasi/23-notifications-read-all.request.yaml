$kind: http-request
name: '23. Tandai semua notifikasi dibaca'
method: POST
url: '{{baseUrl}}/notifications/read-all'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (pm.environment.get('allowWrites') !== 'true') {
        pm.test('Dilewati: allowWrites=false', () => pm.expect(true).to.eql(true));
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('pesan sukses', () => pm.expect(body.data && body.data.message).to.be.a('string').and.not.empty);