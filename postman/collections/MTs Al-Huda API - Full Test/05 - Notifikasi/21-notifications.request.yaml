$kind: http-request
name: '21. Daftar notifikasi'
method: GET
url: '{{baseUrl}}/notifications'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('unread_count angka', () => pm.expect(body.data && body.data.unread_count).to.be.a('number'));
      pm.test('notifications array', () => pm.expect(body.data && body.data.notifications).to.be.an('array'));
      if (body.data && body.data.notifications.length > 0) {
        pm.collectionVariables.set('notificationId', String(body.data.notifications[0].id));
      }