$kind: http-request
name: '31. Presensi pulang (menulis data)'
method: POST
url: '{{baseUrl}}/attendance/check-out'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "note": "Uji Postman - pulang" }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (pm.environment.get('allowWrites') !== 'true') {
        pm.test('Dilewati: allowWrites=false', () => pm.expect(true).to.eql(true));
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      let body = {};
      try { body = pm.response.json(); } catch (e) {}
      pm.test('200 berhasil atau 422 sudah/belum check-in', () => pm.expect([200, 422]).to.include(pm.response.code));
      if (pm.response.code === 200) {
        pm.test('check_out_at terisi', () => pm.expect(body.data.check_out_at).to.be.a('string').and.not.empty);
      } else {
        pm.test('kode 422 dikenal', () => pm.expect(['NOT_CHECKED_IN', 'ALREADY_CHECKED_OUT']).to.include(body.error && body.error.code));
      }